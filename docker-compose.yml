version: '3.8'

services:
  mc:
    image: itzg/minecraft-server:java21
    container_name: mc_server_1.21
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FORGE"          
      VERSION: "1.21.1"       
      SEED: "ваш_сид_тут"
      MEMORY: "4G"
      ONLINE_MODE: "FALSE"     
      OVERRIDE_SERVER_PROPERTIES: "TRUE"    
    volumes:
      - ./minecraft-data:/data
    restart: unless-stopped

